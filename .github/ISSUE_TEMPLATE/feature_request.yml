name: Feature request
description: Propose a developer-facing improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the concrete task and why the current API is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an API or CLI example and any relation to the published STAIR method.
    validations:
      required: true
